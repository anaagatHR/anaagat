# Cloudflare Pages project for anaagathr.com. Secrets are NOT kept here: set them in the Pages dashboard
# (Settings > Variables and Secrets) or locally in .dev.vars (see .dev.vars.example).
name = "anaagat"
pages_build_output_dir = "public"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
SITE_URL = "https://anaagathr.com"

# Page edits from the inline editor. Create with: npx wrangler kv namespace create CONTENT
[[kv_namespaces]]
binding = "CONTENT"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Blog posts. Create with: npx wrangler d1 create anaagat
[[d1_databases]]
binding = "DB"
database_name = "anaagat"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# Images uploaded in the editor. Create with: npx wrangler r2 bucket create anaagat-media
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "anaagat-media"
