<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team sign-in | Anaagat Humanpower</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/assets/icon-192.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="theme-color" content="#1d2b5e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600&family=Mulish:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="signin">
<main class="signin__grid">
  <section class="signin__art" aria-hidden="true">
    <ol class="track signin__track">
      <li class="track__step"><span class="tile tile--lg"><svg viewBox="0 0 24 24"><circle cx="9" cy="7" r="4"/><path d="M2 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2M16 11l2 2 4-4"/></svg></span><span class="track__txt"><b>Hire</b></span></li>
      <li class="track__step"><span class="tile tile--lg"><svg viewBox="0 0 24 24"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg></span><span class="track__txt"><b>Deploy</b></span></li>
      <li class="track__step"><span class="tile tile--lg"><svg viewBox="0 0 24 24"><path d="M7 4h10M7 8.5h10M9 4c4.5 0 6 2 6 4.25S13.5 12.5 9 12.5H7l7.5 7.5"/></svg></span><span class="track__txt"><b>Pay</b></span></li>
      <li class="track__step"><span class="tile tile--lg tile--gold"><svg viewBox="0 0 24 24"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/><path d="M9 12l2 2 4-4"/></svg></span><span class="track__txt"><b>Comply</b></span></li>
    </ol>
    <p class="signin__motto">Worshiping Work.</p>
  </section>

  <section class="signin__panel" aria-labelledby="si-title">
    <a class="signin__logo" href="/"><img src="/assets/logo.png" alt="Anaagat Humanpower home" width="600" height="256"></a>
    <h1 id="si-title">Team sign-in</h1>
    <p class="lead">Edit the website and review the daily blog drafts. Use your company Google account.</p>
    <p class="signin__msg" id="msg" role="alert" hidden></p>
    <a class="gbtn" href="/auth/google">
      <svg viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path class="g-y" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path class="g-r" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path class="g-g" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path class="g-b" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      <span>Continue with Google</span>
    </a>
    <p class="signin__fine">Only Anaagat team members can sign in. Visitors don’t need an account: <a href="/#quote">ask for a quote</a> or call <a href="tel:+919001965072">+91 90019 65072</a>.</p>
  </section>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search), el = document.getElementById('msg');
  var text = {
    config: 'Google sign-in isn’t set up yet. Add GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET and SESSION_SECRET in Cloudflare.',
    state: 'That sign-in link expired. Please try again.',
    google: 'Google didn’t confirm the sign-in. Please try again.',
    domain: 'That Google account isn’t on the Anaagat team. Use your company account.',
    denied: 'Sign-in was cancelled.'
  }[q.get('error')] || (q.has('signed_out') ? 'You’re signed out.' : '');
  if (text) { el.textContent = text; el.hidden = false; el.classList.toggle('is-ok', !q.get('error')); }
})();
</script>
</body>
</html>
